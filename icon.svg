<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="STRUM — 에어로밴드 기타 학습">
  <title>STRUM</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="76%">
      <stop offset="0" stop-color="#fdfbf5"/>
      <stop offset="58%" stop-color="#f8f5ee"/>
      <stop offset="100%" stop-color="#efe6d3"/>
    </radialGradient>
    <linearGradient id="body" x1="14%" y1="0%" x2="86%" y2="100%">
      <stop offset="0" stop-color="#3e5346"/>
      <stop offset="42%" stop-color="#2a3931"/>
      <stop offset="100%" stop-color="#1b2420"/>
    </linearGradient>
    <linearGradient id="neck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#efdfbe"/>
      <stop offset="52%" stop-color="#ddc59d"/>
      <stop offset="100%" stop-color="#c1a074"/>
    </linearGradient>
    <linearGradient id="gold" x1="10%" y1="0%" x2="80%" y2="100%">
      <stop offset="0" stop-color="#f6d6ab"/>
      <stop offset="52%" stop-color="#e0aa72"/>
      <stop offset="100%" stop-color="#bd7f49"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="5" dy="13" stdDeviation="13" flood-color="#2b3a31" flood-opacity=".20"/>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6c496" stop-opacity=".34"/>
      <stop offset="65%" stop-color="#e6c496" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#e6c496" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 따뜻한 크림 배경 (maskable: 사방 꽉 참) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="252" cy="272" r="200" fill="url(#halo)"/>

  <!-- 기타: 목이 오른쪽 위로 기울어진 대각선 실루엣 -->
  <g transform="translate(236.0 314.0) rotate(19) scale(0.9)" filter="url(#soft)">
    <!-- 목 -->
    <path d="M -12.5 -104 L -9 -212 L 9 -212 L 12.5 -104 Z" fill="url(#neck)"/>
    <!-- 프렛 -->
    <g stroke="#2b3932" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round">
      <line x1="-12.2" y1="-132" x2="12.2" y2="-132"/>
      <line x1="-11.6" y1="-162" x2="11.6" y2="-162"/>
      <line x1="-10.8" y1="-192" x2="10.8" y2="-192"/>
    </g>
    <!-- 너트 -->
    <rect x="-13" y="-217" width="26" height="6.5" rx="2.6" fill="#f8efdd"/>
    <!-- 헤드스톡 -->
    <path d="M -9 -213 L -14.5 -240 C -16 -259 16 -259 14.5 -240 L 9 -213 Z" fill="url(#body)"/>
    <g fill="url(#gold)">
      <circle cx="-12.6" cy="-247" r="3.4"/>
      <circle cx="-11.4" cy="-231" r="3.4"/>
      <circle cx="12.6" cy="-247" r="3.4"/>
      <circle cx="11.4" cy="-231" r="3.4"/>
    </g>

    <!-- 몸통 -->
    <path d="M 0 -104 C 32 -104 54 -86 54 -58 C 54 -38 42 -20 42 0 C 42 28 76 44 76 74 C 76 102 40 118 0 118 C -40 118 -76 102 -76 74 C -76 44 -42 28 -42 0 C -42 -20 -54 -38 -54 -58 C -54 -86 -32 -104 0 -104 Z" fill="url(#body)"/>
    <!-- 몸통 상단 하이라이트 -->
    <path d="M -36 -82 C -18 -96 18 -96 36 -82 C 20 -88 -20 -88 -36 -82 Z" fill="#ffffff" fill-opacity=".12"/>
    <!-- 픽가드 -->
    <path d="M 20 -6 C 34 4 44 26 44 50 C 30 30 22 14 20 -6 Z" fill="#f8f5ee" fill-opacity=".07"/>

    <!-- 사운드홀 + 로제트 -->
    <circle cx="0" cy="-50" r="36" fill="none" stroke="url(#gold)" stroke-width="3.8"/>
    <circle cx="0" cy="-50" r="31" fill="none" stroke="#f8f5ee" stroke-width="1.3" stroke-opacity=".38"/>
    <circle cx="0" cy="-50" r="27" fill="#121a16"/>

    <!-- 브리지 -->
    <rect x="-29" y="62" width="58" height="14" rx="5.5" fill="url(#gold)"/>

    <!-- 줄: 너트에서 브리지로 살짝 벌어짐 -->
    <g stroke-linecap="round">
      <g stroke="#23302a" stroke-opacity=".22" stroke-width="3">
        <line x1="-8" y1="-216" x2="-22" y2="68"/>
        <line x1="-4" y1="-216" x2="-11" y2="68"/>
        <line x1="0"  y1="-216" x2="0"   y2="68"/>
        <line x1="4"  y1="-216" x2="11"  y2="68"/>
        <line x1="8"  y1="-216" x2="22"  y2="68"/>
      </g>
      <g stroke="#fcf8ec" stroke-opacity=".74" stroke-width="1.5">
        <line x1="-8" y1="-216" x2="-22" y2="68"/>
        <line x1="-4" y1="-216" x2="-11" y2="68"/>
        <line x1="0"  y1="-216" x2="0"   y2="68"/>
        <line x1="4"  y1="-216" x2="11"  y2="68"/>
        <line x1="8"  y1="-216" x2="22"  y2="68"/>
      </g>
    </g>
  </g>

  <!-- 반짝임 -->
  <g fill="url(#gold)" fill-opacity=".85">
    <circle cx="366" cy="128" r="6.5"/>
    <circle cx="392" cy="164" r="3.8"/>
    <circle cx="344" cy="98" r="2.8"/>
  </g>
</svg>
